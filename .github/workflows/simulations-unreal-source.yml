{
  "name": "Simulations Unreal source batch",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "transfer": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "Ishmael366/Unreal-FPS-Game",
        "SOURCE_JOBS": "[{\"repository\": \"dartmouth-cs98/hack-a-thing-21f-2-julian\", \"branch\": \"main\", \"tree\": \"b616a62b06a87bc8c3f242c300bdf071a29c877a\"}, {\"repository\": \"jonesah/Syntra-BPE-Rocks-BP\", \"branch\": \"main\", \"tree\": \"28adfcbd82cc3e8d9b22360f83388b41040301fd\"}, {\"repository\": \"joshua-dejesus/ue5-target-game\", \"branch\": \"main\", \"tree\": \"13fe386d1c7719de733f8a94f796774a78d1411a\"}, {\"repository\": \"CalebHaleDev/UnrealLearningProject\", \"branch\": \"main\", \"tree\": \"895b15d25dc4add4d9ee807d6d1b6383381be681\"}, {\"repository\": \"FrozenLittleGirl/Ninja\", \"branch\": \"main\", \"tree\": \"cd8d6dcc1d5f08a0f17e54a5078b66e2e173261c\"}, {\"repository\": \"NerbzHub/UnrealTutorial\", \"branch\": \"master\", \"tree\": \"0fd21cf565f63f41e3f87e03dbcc27ac71540842\"}, {\"repository\": \"OmSonawane102/OhScrepler\", \"branch\": \"main\", \"tree\": \"0c82f9a879102a8e554c733ab21a167b4e521564\"}, {\"repository\": \"SmirtiParajuli/GameDesignProject_UnrealEngine\", \"branch\": \"main\", \"tree\": \"013492a1277023e8b21fca80331c3c54d2bd142e\"}, {\"repository\": \"Sondro/UnrealHx_BattleRoyale\", \"branch\": \"master\", \"tree\": \"a719d897c6b05777606c8c3d16303f11c7918cc8\"}, {\"repository\": \"dlarkinc/SideScrollerBP\", \"branch\": \"main\", \"tree\": \"ca8c0abde135e942b25a68cc21bdf064479f5577\"}, {\"repository\": \"eduardomr/Car-Racing-Game\", \"branch\": \"main\", \"tree\": \"a2b327e3e7840d8170705fb8bb019521a55cbb6c\"}, {\"repository\": \"edwinyung/MMORPG\", \"branch\": \"master\", \"tree\": \"e22e34f6d91c3fdd360e6f589290c8f985852d78\"}, {\"repository\": \"emmettirl/SoulConstruct\", \"branch\": \"main\", \"tree\": \"79b7db796f66f38df989e7593299a5e8cb772bf2\"}, {\"repository\": \"jellyfishuang/unreal_FPS\", \"branch\": \"main\", \"tree\": \"068281d450bc4dbe39acfc8f0f8de6a6eda755a3\"}, {\"repository\": \"justindxln/SideRunnerCPP\", \"branch\": \"main\", \"tree\": \"79c7e000b772365938846e44cace7fd7f474c516\"}, {\"repository\": \"malriy/UEProject\", \"branch\": \"main\", \"tree\": \"670cf4a709d1936e95a353b84694dd8949d7d6e2\"}, {\"repository\": \"michal-flaska/ue5_tutorial\", \"branch\": \"main\", \"tree\": \"af87f671de6310f76e9cf7ca158ad27ac8d30ace\"}]"
      },
      "steps": [
        {
          "name": "Copy source archives and verify LFS assets",
          "run": "python3 - <<'PY'\nimport os,json,subprocess,urllib.request,urllib.parse,hashlib,tarfile,tempfile,shutil,time\nfrom pathlib import Path\njobs=json.loads(os.environ['SOURCE_JOBS']);dest=os.environ['GITHUB_REPOSITORY'];tag='simulations-unreal-source-batch';audit=[]\ndef gh(args):\n r=subprocess.run(['gh']+args,capture_output=True,text=True)\n if r.returncode:raise RuntimeError(r.stderr[:1000])\n return r.stdout\ntry:gh(['release','view',tag])\nexcept:gh(['release','create',tag,'--title','Simulations Unreal source batch','--notes','Attributed source snapshots recovered from Simulations playlist video-ID matches. See source-transfer-audit.json for exact origins and LFS verification. Community tutorial work; original authors retain credit.'])\ntry:\n gh(['release','download',tag,'--pattern','source-transfer-audit.json','--clobber']);audit=json.loads(Path('source-transfer-audit.json').read_text())\nexcept Exception:pass\ncompleted={x['repository'] for x in audit if x.get('status')=='uploaded'}\nfor job in jobs:\n if job['repository'] in completed:continue\n folder=Path(tempfile.mkdtemp());repo=job['repository'];item=dict(job)\n try:\n  name=repo.replace('/','--');archive=folder/(name+'.tar.gz');req=urllib.request.Request('https://api.github.com/repos/'+repo+'/tarball/'+job['branch'],headers={'User-Agent':'Unreal-source-recovery'})\n  with urllib.request.urlopen(req,timeout=90) as src,open(archive,'wb') as out:shutil.copyfileobj(src,out)\n  pointers=[]\n  with tarfile.open(archive) as tf:\n   for m in tf:\n    if m.isfile() and m.size<1024:\n     data=tf.extractfile(m).read()\n     if data.startswith(b'version https://git-lfs.github.com/spec/v1'):pointers.append((m.name,data.decode()))\n  item['lfs_pointer_count']=len(pointers);item['lfs_verified']=not pointers\n  if pointers:\n   import concurrent.futures,collections\n   def fetch_asset(entry):\n    path,text=entry;oid=next(s.split()[1].split(':')[1] for s in text.splitlines() if s.startswith('oid '));size=int(next(s.split()[1] for s in text.splitlines() if s.startswith('size ')));target=folder/oid\n    url='https://media.githubusercontent.com/media/'+repo+'/'+job['branch']+'/'+urllib.parse.quote(path.split('/',1)[1])\n    with urllib.request.urlopen(url,timeout=90) as src,open(target,'wb') as out:shutil.copyfileobj(src,out)\n    h=hashlib.sha256()\n    with open(target,'rb') as f:\n     for chunk in iter(lambda:f.read(4*1024*1024),b''):h.update(chunk)\n    if target.stat().st_size!=size or h.hexdigest()!=oid:raise RuntimeError('LFS verification failed: '+path)\n    return target\n   entries=iter(pointers);queue=collections.deque();names={p for p,t in pointers};rebuilt=folder/(name+'-complete.tar.gz')\n   with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:\n    for entry in list(pointers)[:8]:queue.append(pool.submit(fetch_asset,entry));next(entries)\n    with tarfile.open(archive) as src,tarfile.open(rebuilt,'w:gz',compresslevel=1) as out:\n     for m in src:\n      if m.name in names:\n       target=queue.popleft().result();m.size=target.stat().st_size\n       with open(target,'rb') as f:out.addfile(m,f)\n       target.unlink()\n       try:queue.append(pool.submit(fetch_asset,next(entries)))\n       except StopIteration:pass\n      else:out.addfile(m,src.extractfile(m) if m.isfile() else None)\n   archive.unlink();rebuilt.rename(archive);item['lfs_verified']=True\n  h=hashlib.sha256();parts=[]\n  with open(archive,'rb') as source:\n   if archive.stat().st_size<1900000000:\n    for chunk in iter(lambda:source.read(4*1024*1024),b''):h.update(chunk)\n    gh(['release','upload',tag,str(archive),'--clobber']);parts=[archive.name]\n   else:\n    n=0\n    while True:\n     data=source.read(1500000000)\n     if not data:break\n     h.update(data);part=folder/(archive.name+'.part'+str(n).zfill(3));part.write_bytes(data);gh(['release','upload',tag,str(part),'--clobber']);parts.append(part.name);part.unlink();n+=1\n  item.update(status='uploaded',sha256=h.hexdigest(),bytes=archive.stat().st_size,assets=parts)\n except Exception as e:item.update(status='blocked',error=str(e))\n audit.append(item);Path('source-transfer-audit.json').write_text(json.dumps(audit,indent=2));gh(['release','upload',tag,'source-transfer-audit.json','--clobber']);print(repo,item['status'],flush=True);shutil.rmtree(folder,ignore_errors=True)\nif any(x['status']!='uploaded' for x in audit):raise SystemExit('Some sources require follow-up; see release audit')\n\nPY"
        }
      ]
    }
  }
}