{
  "name": "Priority Unreal AI and Castle projects",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "transfer": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "Ishmael366/Unreal-FPS-Game",
        "DOWNLOAD_JOBS": "[{\"video_id\": \"R_HFCPd5eAw\", \"title\": \"AI Game Starter Assets\", \"file_id\": \"AI-Game-Starter-Assets\", \"source_url\": \"https://www.youtube.com/watch?v=R_HFCPd5eAw\", \"download_url\": \"https://www.unrealsenseiacademy.com/resource_redirect/downloads/file-uploads/sites/2147487049/themes/2168065364/downloads/84d0cad-1b61-6e83-5f4d-ceb54ee0afd8_GameAIAssets.zip\"}, {\"video_id\": \"e83pKSlfGR0\", \"title\": \"Castle Environment and Beginner Project Assets\", \"file_id\": \"Castle-Environment-Assets\", \"source_url\": \"https://www.youtube.com/watch?v=e83pKSlfGR0\", \"download_url\": \"https://www.unrealsenseiacademy.com/resource_redirect/downloads/file-uploads/sites/2147487049/themes/2167667402/downloads/eae0572-843-f82d-8db4-bfc1a325be5d_IntroUnreal58.zip\"}]"
      },
      "steps": [
        {
          "name": "Upload and verify priority Unreal project archives",
          "run": "python3 - <<'PY'\nimport json,os,subprocess,tempfile,hashlib,shutil,zipfile,sys\nfrom pathlib import Path\nimport urllib.request,urllib.parse,http.cookiejar\nfrom html.parser import HTMLParser\nclass DriveForm(HTMLParser):\n def __init__(self):super().__init__();self.action=None;self.fields={}\n def handle_starttag(self,tag,attrs):\n  d=dict(attrs)\n  if tag=='form':self.action=d.get('action')\n  if tag=='input' and d.get('name'):self.fields[d['name']]=d.get('value','')\ndef drive_download(id,output):\n opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()));url='https://drive.usercontent.google.com/download?export=download&confirm=t&id='+id\n for attempt in range(3):\n  response=opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=90);prefix=response.read(65536)\n  if prefix.startswith((b'PK',b'Rar!')):\n   with open(output,'wb') as f:f.write(prefix);shutil.copyfileobj(response,f)\n   return output\n  body=prefix+response.read(1000000);parser=DriveForm();parser.feed(body.decode(errors='replace'))\n  if not parser.action:raise RuntimeError('Drive did not provide a downloadable file or confirmation form')\n  url=urllib.parse.urljoin(response.url,parser.action)+'?'+urllib.parse.urlencode(parser.fields)\n raise RuntimeError('Drive download confirmation did not resolve')\njobs=json.loads(os.environ['DOWNLOAD_JOBS']);tag='priority-unreal-projects';audit=[]\ndef gh(args):\n r=subprocess.run(['gh']+args,capture_output=True,text=True)\n if r.returncode:raise RuntimeError(r.stderr[:800])\n return r.stdout\ntry:gh(['release','view',tag])\nexcept:gh(['release','create',tag,'--title','Priority Unreal project files','--notes','Original publicly accessible project files linked in the Simulations playlist. Large archives are split into ordered parts; concatenate all parts to restore the original file. See original-download-audit.json for original URLs, SHA-256 hashes, ZIP checks and download errors. License information is included with the files.'])\ntry:\n gh(['release','download',tag,'--pattern','original-download-audit.json','--clobber']);audit=json.loads(Path('original-download-audit.json').read_text())\nexcept Exception:pass\ncompleted={x['file_id'] for x in audit if x.get('status')=='uploaded'}\naudit=[x for x in audit if x.get('status')=='uploaded']\nfor job in jobs:\n if job['file_id'] in completed:continue\n folder=Path(tempfile.mkdtemp());item=dict(job)\n try:\n  file=folder/(job['video_id']+'-'+job['file_id']+'.zip')\n  with urllib.request.urlopen(urllib.request.Request(job['download_url'],headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.unrealsenseiacademy.com/'}),timeout=90) as src,open(file,'wb') as out:shutil.copyfileobj(src,out)\n  result=str(file)\n  if not result:raise RuntimeError('Original file unavailable or requires owner access')\n  if zipfile.is_zipfile(file):\n   with zipfile.ZipFile(file) as z:\n    item['project_files']=[n for n in z.namelist() if n.endswith('.uproject')];bad=z.testzip()\n    if bad:raise RuntimeError('ZIP CRC failed: '+bad)\n  else:\n   renamed=file.with_suffix('.rar');file.rename(renamed);file=renamed;tool=shutil.which('7z') or shutil.which('7zz')\n   if not tool:raise RuntimeError('RAR checker unavailable on runner')\n   check=subprocess.run([tool,'t',str(file)],capture_output=True,text=True)\n   if check.returncode:raise RuntimeError('RAR integrity check failed: '+check.stdout[-400:])\n   item['archive_format']='RAR';item['archive_integrity_verified']=True\n  h=hashlib.sha256();assets=[]\n  with open(file,'rb') as src:\n   if file.stat().st_size<1900000000:\n    for chunk in iter(lambda:src.read(4*1024*1024),b''):h.update(chunk)\n    gh(['release','upload',tag,str(file),'--clobber']);assets.append(file.name)\n   else:\n    number=0\n    while True:\n     data=src.read(1500000000)\n     if not data:break\n     h.update(data);part=folder/(file.name+'.part'+str(number).zfill(3));part.write_bytes(data);gh(['release','upload',tag,str(part),'--clobber']);assets.append(part.name);part.unlink();number+=1\n  item.update(status='uploaded',bytes=file.stat().st_size,sha256=h.hexdigest(),zip_crc_verified=True,assets=assets)\n except Exception as e:item.update(status='blocked',error=str(e))\n audit.append(item);Path('original-download-audit.json').write_text(json.dumps(audit,indent=2));gh(['release','upload',tag,'original-download-audit.json','--clobber']);print(job['video_id'],item['status'],flush=True);shutil.rmtree(folder,ignore_errors=True)\nif any(x['status']!='uploaded' for x in audit):raise SystemExit('Some original links are unavailable; see audit')\n\nPY"
        }
      ]
    }
  }
}