<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unity Studies — Daniel Nguyen</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0a0e14;color:#eef3f8}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:12px 20px;background:#101722;border-bottom:1px solid #293545}header a{color:#9cdde3;text-decoration:none}h1{font-size:20px;margin:0}button,select,input,textarea{font:inherit;color:inherit;background:#192332;border:1px solid #3b5066;border-radius:9px;padding:10px 14px}button{cursor:pointer}button:hover{background:#2a3b50}button.primary{background:#047c87;border-color:#1aa1ad}button:disabled{opacity:.5;cursor:default}label{font-size:14px}select{max-width:260px}#stage{height:calc(100vh - 155px);min-height:430px;position:relative;background:#101622}canvas{display:block;width:100%;height:100%;outline:none}#hud{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;pointer-events:none}#hud span{background:#101824d9;padding:8px 12px;border-radius:8px;font-variant-numeric:tabular-nums}#message{position:absolute;bottom:15px;left:20px;right:20px;text-align:center;pointer-events:none;font-size:16px;text-shadow:0 1px 5px #000}#panel{position:absolute;inset:0;display:grid;place-items:center;background:#070d146b}#panel[hidden]{display:none}.sheet{width:min(580px,95%);max-height:92%;overflow:auto;background:#101824f2;border:1px solid #435268;border-radius:18px;padding:25px;box-shadow:0 15px 80px #0008}.sheet h2{margin-top:0}#actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#net textarea{display:block;width:100%;height:65px;margin:8px 0;font-size:12px;resize:vertical}#net section{margin-top:16px;padding-top:12px;border-top:1px solid #354353}#networkDetails{max-width:650px}footer{padding:10px 18px;background:#101722;display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:87px}#controls{flex:1;min-width:240px;font-size:13px;color:#bccbd8}#loadbar{height:8px;background:#344359;border-radius:6px;overflow:hidden;margin:15px 0}#loadbar i{height:100%;width:0;display:block;background:#43c7c0}#loaderState{font-size:14px;color:#bac8d6}.buttons{display:flex;gap:8px;flex-wrap:wrap}#environment[hidden],#net[hidden]{display:none}@media(max-width:620px){header{align-items:flex-start;gap:8px;padding:10px}h1{font-size:17px}select{max-width:160px}#stage{height:65vh}footer button{font-size:12px;padding:8px}#hud{font-size:12px}.sheet{padding:18px}}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px;color:white;text-shadow:0 0 4px black;pointer-events:none}</style></head><body><header><div><a href="../sports.html">← Sports &amp; Games</a><h1 id="title">Loading Unity study</h1></div><label>Study <select id="study" aria-label="Choose a study"></select></label></header><main><div id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="Playable Unity game"></canvas><div id="hud" aria-live="off"><span id="vitals">Preparing game</span><span id="stats"></span><span id="clock">Time 0:00</span></div><div id="crosshair" hidden>+</div><div id="message" role="status"></div><div id="panel"><div class="sheet"><h2 id="panelTitle">Loading Unity</h2><p id="instructions"></p><p id="loaderState">Downloading the game engine. Subsequent studies reuse this download.</p><div id="loadbar"><i></i></div><div id="actions"><button class="primary" id="start" disabled>Play demo</button><button id="again" hidden>Restart</button></div><div id="net" hidden><p>Two-player room. The host shares an invitation; the guest sends a reply. Keep the host’s game open.</p><button id="host">Create room</button><section><label for="joinInput">Invitation from host</label><textarea id="joinInput" placeholder="Paste the invitation here"></textarea><button id="join">Join invitation</button></section><section><label for="inviteOut">Your invitation</label><textarea id="inviteOut" readonly></textarea><button data-copy="inviteOut">Copy invitation</button><label for="answerInput">Reply from guest</label><textarea id="answerInput" placeholder="Paste the guest’s reply here"></textarea><button id="accept">Connect guest</button></section><section><label for="answerOut">Your reply</label><textarea id="answerOut" readonly></textarea><button data-copy="answerOut">Copy reply</button></section><p id="netStatus" role="status"></p><button id="enterRoom">Continue to arena</button></div></div></div></div></main><footer><p id="controls">Loading controls…</p><div class="buttons"><button id="interact">Interact (E)</button><button id="pause">Pause / menu</button><button id="sound" aria-pressed="false">Sound off</button><button id="networkDetails" hidden>Room connection</button></div><label id="environment" hidden>Wind <input id="wind" type="range" min="0" max="2" value="0.6" step="0.1"></label></footer><script src="network.js"></script><script>
const catalog={"Forest-Survival":"Forest Survival","Wind-Meadow":"Wind Meadow","LAN-Arena":"LAN Arena","Shrine-Path":"Shrine Path","Sunlit-Side-Runner":"Sunlit Side Runner","Castle-Relics":"Castle Relics","Neon-Vault":"Neon Vault","Silent-Extraction":"Silent Extraction","Sky-Island-Trail":"Sky Island Trail","Archive-Escape":"Archive Escape","Facility-Breach":"Facility Breach","Shield-Arena":"Shield Arena"};
const el=id=>document.getElementById(id),select=el('study'),canvas=el('unity-canvas');let current={},forcedPanel=false;
const query=new URLSearchParams(location.search);let slug=query.get('study');if(!catalog[slug])slug='Forest-Survival';for(const [id,name]of Object.entries(catalog)){const o=new Option(name,id);select.add(o);}select.value=slug;el('title').textContent=catalog[slug];select.onchange=()=>{const u=new URL(location.href);u.searchParams.set('study',select.value);document.exitPointerLock?.();if(window.unityInstance)window.unityInstance.Quit().catch(()=>{}).finally(()=>{location.href=u.href;});else location.href=u.href;};
function call(method,arg){if(!window.unityInstance)return;if(arg===undefined)window.unityInstance.SendMessage('Study Web Bridge',method);else window.unityInstance.SendMessage('Study Web Bridge',method,String(arg));}
function focusGame(){canvas.focus();}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
el('start').onclick=()=>{forcedPanel=false;focusGame();call('StartGame');};el('again').onclick=()=>{forcedPanel=false;call('Restart');};el('interact').onclick=()=>{call('Interact');canvas.focus();};el('pause').onclick=()=>{forcedPanel=false;call('PauseGame');};el('sound').onclick=()=>call('ToggleSound');el('wind').oninput=e=>call('SetWind',e.target.value);
el('host').onclick=()=>{forcedPanel=true;call('HostRoom');};el('join').onclick=()=>{forcedPanel=true;call('JoinRoom',el('joinInput').value);};el('accept').onclick=()=>call('AcceptAnswer',el('answerInput').value);el('enterRoom').onclick=()=>{forcedPanel=false;focusGame();call('StartGame');};el('networkDetails').onclick=()=>{forcedPanel=true;document.exitPointerLock?.();el('panel').hidden=false;};for(const b of document.querySelectorAll('[data-copy]'))b.onclick=async()=>{try{await navigator.clipboard.writeText(el(b.dataset.copy).value);b.textContent='Copied';}catch{el(b.dataset.copy).select();b.textContent='Select and copy';}};
window.studyUI={receive(s){current=s;el('title').textContent=s.title;const controls=(s.mode==='Multiplayer'?'Host: create a room and share your invitation. Guest: join the invitation and return your reply. Host: connect the reply. Both: continue to the arena. WASD move; hold right mouse to look.':s.instructions).replace(/mouse look|mouse camera|mouse turn/g,'hold right mouse to look');el('instructions').textContent=controls;el('controls').textContent=controls;el('panelTitle').textContent=s.state==='Ready'?'Ready to play':s.state==='Paused'?'Paused':s.state==='Won'?'Complete':s.state==='Lost'?'Try again':s.title;el('panel').hidden=s.state==='Playing'&&!forcedPanel;el('start').hidden=s.mode==='Multiplayer'||['Won','Lost'].includes(s.state);el('start').disabled=false;el('start').textContent=s.state==='Paused'?'Resume':'Play demo';el('again').hidden=!['Won','Lost'].includes(s.state);el('net').hidden=s.mode!=='Multiplayer';el('networkDetails').hidden=s.mode!=='Multiplayer';el('netStatus').textContent=s.network||'Create or join a room';if(s.invite)el('inviteOut').value=s.invite;if(s.answer)el('answerOut').value=s.answer;el('sound').textContent=s.sound?'Sound on':'Sound off';el('sound').setAttribute('aria-pressed',String(s.sound));el('environment').hidden=s.mode!=='Meadow';el('crosshair').hidden=s.state!=='Playing'||!['Shooter','Horror','Infiltration','Survival'].includes(s.mode);el('vitals').textContent=s.mode==='Survival'?`Health ${Math.ceil(s.health)} · Food ${Math.ceil(s.food)} · Water ${Math.ceil(s.water)} · Wood ${s.wood}`:s.mode==='Meadow'?'Explore · G grass · T sun · Tab cursor':s.mode==='Multiplayer'?`Players ${s.players} · ${s.network}`:s.mode==='Duel'?`Health ${Math.ceil(s.health)} · Stamina ${Math.floor(s.stamina)}`:s.mode==='SkyIslands'?`Gems ${s.gems} / 6`:s.mode==='SideRunner'?`Tokens ${s.coins} / 10`:s.mode==='ClickRpg'||s.mode==='Castle'?`Health ${Math.ceil(s.health)} · Stamina ${Math.floor(s.stamina)}`:`Health ${Math.ceil(s.health)} · Ammo ${s.ammo} / ${s.reserve}`;el('stats').textContent=`Tokens ${s.coins} · Gems ${s.gems} · Defeated ${s.defeated}`;const t=Math.floor(s.time);el('clock').textContent=`Time ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;el('message').textContent=s.prompt?`E — ${s.prompt}`:s.message;el('loadbar').hidden=true;el('loaderState').hidden=true;}};
const buildUrl='Build',loaderUrl=buildUrl+'/{{{ LOADER_FILENAME }}}';const config={dataUrl:buildUrl+'/{{{ DATA_FILENAME }}}',frameworkUrl:buildUrl+'/{{{ FRAMEWORK_FILENAME }}}',codeUrl:buildUrl+'/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Daniel Nguyen',productName:'Unity Studies',productVersion:'1.0',devicePixelRatio:1};const script=document.createElement('script');script.src=loaderUrl;script.onload=()=>createUnityInstance(canvas,config,p=>{el('loadbar').firstElementChild.style.width=`${Math.round(p*100)}%`;el('loaderState').textContent=`Loading game ${Math.round(p*100)}%`;}).then(instance=>{window.unityInstance=instance;}).catch(e=>{el('panelTitle').textContent='The game could not start';el('loaderState').textContent=String(e);});document.body.appendChild(script);
</script></body></html>
